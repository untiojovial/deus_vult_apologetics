{day:21,title:"El pluscuamperfecto y el futuro perfecto",subtitle:"Los tiempos compuestos: anterioridad y condición futura",
tips:[
{t:'<strong>El pluscuamperfecto</strong> (plusquamperfectum = "más que perfecto") describe una acción que había sido completada antes de otra acción pasada. Activo: tema de perfecto + -eram, -eras, -erat, -eramus, -eratis, -erant. <em>Amaveram</em> = "yo había amado".'},
{t:'<strong>El pluscuamperfecto pasivo</strong> se forma con el PPP + <em>eram</em> (el imperfecto de esse): <em>amatus eram</em> = "yo había sido amado". El PPP concuerda en género y número con el sujeto — exactamente igual que el perfecto pasivo pero con <em>eram</em> en lugar de <em>sum</em>.'},
{t:'<strong>El futuro perfecto activo</strong>: tema de perfecto + -ero, -eris, -erit, -erimus, -eritis, -erint. <em>Amavero</em> = "yo habré amado". Se usa en la prótasis de condiciones referidas al futuro (si + fut. perf. → futuro simple) y en cláusulas temporales con <em>cum, ubi, postquam</em>.'},
{t:'<strong>Tabla mnemónica:</strong> perfecto (-i) → pluscuamperfecto (-eram) → futuro perfecto (-ero). Las tres formas compuestas del sistema del perfecto funcionan análogamente en voz pasiva añadiendo <em>esse, esse, fore</em> al PPP.'},

verse:{lat:'Maria autem conservabat omnia verba haec, conferens in corde suo.',esp:'"María, sin embargo, guardaba todas estas cosas, meditándolas en su corazón" — Lucas 2:19 (Vulgata)',
words:[['Maria','María (nom. — sujeto, nombre indeclinable)'],['autem','sin embargo, pero (partícula adversativa postpositiva)'],['conservabat','guardaba (imperfecto de conservare — acción continua)'],['omnia verba haec','todas estas palabras (acus. neutro pl. + demostr.)'],['conferens','meditando, comparando (PPA de conferre)'],['in corde suo','en su corazón (in + ablativo 3ª decl. + posesivo)']],
insight:'<em>conservabat</em>: imperfecto — acción continua y repetida, no puntual. María "seguía guardando", no "guardó una vez". El PPA <em>conferens</em> (de <em>conferre</em> = reunir, comparar) indica la actividad simultánea: mientras guardaba, meditaba/comparaba. La gramática pinta una imagen de interioridad activa y continua que ninguna traducción captura del todo — el latín de Lucas es aquí particularmente expresivo.'}

{day:22,title:"La oración relativa y los pronombres relativos",subtitle:"Qui, quae, quod — la clave de la subordinación latina",

{t:'<strong>El pronombre relativo qui/quae/quod</strong> introduce oraciones de relativo y concuerda en género y número con su antecedente, pero toma el caso que le corresponde en su propia oración. <em>Homo quem video</em> = "el hombre a quien veo" (quem = acusativo porque es objeto de video).'},
{t:'<strong>La relativización en latín</strong> puede unir frases con gran elegancia. El antecedente puede estar implícito: <em>Quod scis, dic</em> = "Di lo que sabes" (sin antecedente explícito). O puede anticipar el sustantivo: <em>Quam amas, puelam vide</em> = "Mira a la chica que amas".'},
{t:'<strong>El relativo indefinido:</strong> <em>quisquis, quicumque</em> = "cualquiera que, todo el que". <em>Quicumque crediderit</em> = "todo el que creyere". Muy frecuente en el NT latino y en los textos litúrgicos.'},
{t:'<strong>La oración de relativo con subjuntivo</strong> expresa propósito o característica genérica (relativa de característica): <em>Quaero virum qui hoc faciat</em> = "Busco un hombre que haga esto" (genérico, no específico). Con indicativo sería un hombre específico que lo hace.'},
],

insight:'Dos oraciones de relativo con futuro perfecto como condición: <em>qui crediderit</em> y <em>qui non crediderit</em>. El futuro perfecto en la prótasis expresa condición real futura: "cuando haya creído y haya sido bautizado". La voz pasiva del futuro (<em>condemnabitur</em>) es el divino pasivo implícito — Dios no se nombra como agente. El latín capta la asimetría teológica: la salvación se describe activamente (crediderit = creerá de hecho); la condenación pasivamente (condemnabitur = será condenado por la incredulidad).'}

{day:23,title:"La poesía latina: métrica y los hexámetros de Virgilio",subtitle:"La Eneida, las Églogas y el ritmo de la lengua sagrada",
tips:[
{t:'<strong>La poesía latina</strong> no se basa en el acento sino en la cantidad silábica (sílabas largas vs. breves). El metro más noble es el <strong>hexámetro dactílico</strong>, metro de la épica: cada verso tiene 6 pies, donde cada pie puede ser un dáctilo (— ∪ ∪) o un espondeo (— —). El 5º pie casi siempre es dáctilo; el 6º siempre espondeo.'},
{t:'<strong>Virgilio</strong> (70-19 a.C.) es el poeta latino más leído en la historia occidental. La <em>Eneida</em> (12 libros) es el poema fundacional de Roma — Eneas, troyano, llega a Italia y funda el pueblo que dará origen a Roma. La tradición cristiana leyó la 4ª Égloga de Virgilio como profecía del nacimiento de Cristo.'},
{t:'<strong>La 4ª Égloga</strong> de Virgilio (40 a.C.) anuncia el nacimiento de un niño que traerá la Edad de Oro: <em>Iam redit et Virgo, redeunt Saturnia regna</em> — "ya vuelve la Virgen, vuelven los reinos de Saturno". Agustín, Constantino y los Padres la interpretaron como profecía mesianica.'},
{t:'<strong>Las palabras de Virgilio</strong> entraron directamente en la liturgia cristiana: <em>Lux perpetua</em> (luz perpetua), el ritmo de las oraciones, la imagen del pastor, el viaje de Eneas como tipo del alma que busca su patria eterna. Sin Virgilio, la liturgia latina no sería lo que es.'},
],

{day:24,title:"Cicerón y la retórica latina",subtitle:"Pro Lege Manilia, De Amicitia y el arte del discurso",
tips:[
{t:'<strong>Marco Tulio Cicerón</strong> (106-43 a.C.) es el mayor prosista latino. Su obra define el latín clásico. Para el latinista eclesiástico, Cicerón es indispensable porque los Padres de la Iglesia (especialmente Agustín y Jerónimo) admiraban su estilo y lo imitaban.'},
{t:'<strong>Los tres géneros retóricos</strong> de Cicerón (heredados de Aristóteles): (1) <em>genus deliberativum</em> — persuadir sobre el futuro (discursos políticos); (2) <em>genus iudiciale</em> — acusar o defender en un juicio; (3) <em>genus demonstrativum</em> (o <em>epideicticum</em>) — alabar o vituperar (panegíricos, elegías).'},
{t:'<strong>El período ciceroniano</strong> es la unidad sintáctica de Cicerón: una oración larga, cuidadosamente equilibrada, con la principal al final. La tensión se construye progresivamente hasta el verbo final. Agustín heredó este arte de la oración suspendida.'},
{t:'<strong>Vocabulario ciceroniano</strong> que entró en la teología: <em>conscientia</em> (conciencia), <em>providentia</em> (providencia), <em>religio</em> (religión), <em>humanitas</em> (humanidad/cultura), <em>ratio</em> (razón). Cicerón inventó el vocabulario filosófico latino que la teología cristiana adoptó.'},
],

verse:{lat:'Dum spiro, spero. Dum anima est, spes est.',esp:'"Mientras respiro, espero. Mientras hay alma, hay esperanza." — Cicerón (adaptado)',
words:[['Dum spiro','mientras respiro (dum + indicativo presente)'],['spero','espero (1ª sg. pres. de sperare)'],['Dum anima est','mientras hay alma (dum + esse pres.)'],['spes est','hay esperanza (nom. sujeto + esse)']],
insight:'<em>dum</em> con indicativo presente — la simultaneidad continua. El quiasmo espero/aliento invierte el orden: la esperanza precede a la afirmación del aliento. Estas frases cortas, equilibradas, son la marca del aforismo ciceroniano — máxima brevedad con máxima densidad. La espiritualidad cristiana adoptó esta economía lingüística: toda la teología de la esperanza en cuatro palabras latinas.'}
},
{day:25,title:"El latín medieval y escolástico",subtitle:"De las categorías de Aristóteles a la Summa Theologiae",
tips:[
{t:'<strong>El latín medieval</strong> (siglos V-XV) se aleja del latín clásico: vocabulario nuevo, sintaxis simplificada, influencia de las lenguas vernáculas, préstamos del griego teológico. El latín de la Vulgata es su modelo, no Cicerón. Pero mantiene la capacidad de expresión técnica precisa que el latín clásico le dio.'},
{t:'<strong>El latín aristotélico-escolástico</strong> es una creación del siglo XII-XIII: la traducción al latín de las obras de Aristóteles (a través del árabe) generó un vocabulario nuevo. Tomás de Aquino, Alberto Magno, Duns Escoto y Guillermo de Ockham escriben en este latín técnico.'},
{t:'<strong>Las distinciones escolásticas clave:</strong> <em>essentia vs. existentia</em> (esencia vs. existencia), <em>substantia vs. accidens</em> (sustancia vs. accidente), <em>potentia vs. actus</em> (potencia vs. acto), <em>universale vs. particulare</em> (universal vs. particular). Sin estas distinciones, los debates sobre la Trinidad, la encarnación y la eucaristía no pueden articularse.'},
{t:'<strong>La transubstanciación</strong> (<em>transsubstantiatio</em>) — el término teológico más famoso del escolasticismo — fue definido en el Concilio de Letrán IV (1215) usando precisamente la distinción aristotélica sustancia/accidente. Sin el latín aristotélico, la doctrina eucarística no puede expresarse con precisión.'},
],

verse:{lat:'Gratia non destruit naturam, sed perficit.',esp:'"La gracia no destruye la naturaleza, sino que la perfecciona" — Tomás de Aquino, Summa Theologiae I q.1 a.8',
words:[['Gratia','la gracia (nom. 1ª decl. — sujeto)'],['non destruit','no destruye (pres. 3ª sg. de destruere — neg.)'],['naturam','la naturaleza (acus. 1ª decl. — objeto)'],['sed','sino, pero (adversativa fuerte)'],['perficit','perfecciona, lleva a plenitud (pres. 3ª sg. de perficere)']],
insight:'Seis palabras latinas que contienen todo el programa de la teología natural cristiana. <em>perficit</em> de <em>perficere</em> = llevar a la perfección, completar. La gracia no anula ni sustituye la naturaleza — la asume y eleva. Este principio de Tomás (derivado de Aristóteles y de Agustín) es la base de toda la teología sacramental, la cristología y la antropología cristiana católica. Sin el latín escolástico, este matiz no puede expresarse con la misma economía.'}
},
{day:26,title:"Análisis textual: las Confesiones de Agustín I,1",subtitle:"El párrafo más comentado de la teología latina — exégesis completa",
tips:[
{t:'<strong>El libro I,1 de las Confesiones</strong> de Agustín contiene el programa teológico de toda la obra en pocos párrafos. Es el texto más comentado del latín patrístico y el más accesible para el principiante avanzado.'},
{t:'<strong>La estructura del párrafo I,1:</strong> (1) La grandeza de Dios y la pequeñez humana; (2) La paradoja de invocar a Dios sin conocerlo; (3) La pregunta sobre el lugar de Dios (¿dónde habitará en mí?); (4) La afirmación central: "nos hiciste para ti y nuestro corazón está inquieto hasta que descanse en ti".'},
{t:'<strong>Las cuatro paradojas de Agustín:</strong> Dios está en todo pero no es contenido (¿cómo puede habitarme?); te invocaré sin conocerte aún; ¿cómo puedo invocar al que no conozco?; el deseo precede al conocimiento. La sintaxis latina de Agustín construye estas paradojas con oraciones que se desequilibran y se resuelven.'},
{t:'<strong>El latín de Agustín</strong> tiene un ritmo cuidadosamente construido. Cada frase termina en un cursus: <em>cursus planus</em> (— ∪ — ∪ ∪), <em>cursus velox</em> (— ∪ ∪ — ∪ ∪), <em>cursus tardus</em> (— ∪ ∪ — ∪). Este ritmo de cláusulas finales es la música del latín agustiniano.'},
],

verse:{lat:'Magnus es, Domine, et laudabilis valde: magna virtus tua, et sapientiae tuae non est numerus. Fecisti nos ad te et inquietum est cor nostrum, donec requiescat in te.',esp:'"Grande eres, Señor, y muy loable: grande tu poder, y de tu sabiduría no hay número. Nos hiciste para ti y nuestro corazón está inquieto, hasta que descanse en ti." — Agustín, Confesiones I,1',
words:[['Magnus es, Domine','grande eres, Señor (adj. pred. + esse + voc.)'],['et laudabilis valde','y muy loable (adj. 3ª decl. + adv. de intensidad)'],['magna virtus tua','grande tu poder (nom. — nueva oración)'],['sapientiae tuae non est numerus','de tu sabiduría no hay número (gen. de sapientia)'],['Fecisti nos ad te','nos hiciste para ti (perf. 2ª sg. + acus. + prep.)'],['et inquietum est cor nostrum','y nuestro corazón está inquieto (adj. pred. + nom. neut.)'],['donec requiescat in te','hasta que descanse en ti (donec + subj. + in + abl.)']],
insight:'El párrafo abre con tres aclamaciones de la grandeza de Dios (<em>magnus, laudabilis, magna virtus</em>) antes de hacer el diagnóstico del alma (<em>inquietum</em>). La estructura lógica es: afirmación de la grandeza → declaración del origen (<em>fecisti</em>) → diagnosis del estado actual (<em>inquietum</em>) → horizonte de la resolución (<em>requiescat</em>). Toda la teología de Agustín en cuatro frases: de la alabanza a la creación, del desasosiego al descanso escatológico. El latín agustiniano es el latín de la experiencia espiritual.'}
},
{day:27,title:"El latín litúrgico: la Misa Romana",subtitle:"La gramática de la liturgia — el latín más vivo",
tips:[
{t:'<strong>El latín litúrgico</strong> es el latín más vivo — todavía se pronuncia, canta y reza. La Misa romana en forma extraordinaria (el Rito de San Pío V, 1570) y los textos del Misal Romano (forma ordinaria, 1970, con sus partes en latín) son el vocabulario litúrgico que todo latinista eclesiástico debe conocer.'},
{t:'<strong>Las partes invariables de la Misa (<em>Ordinarium</em>):</strong> Kyrie (del griego), Gloria, Credo, Sanctus, Agnus Dei. Las partes variables (<em>Proprium</em>) cambian según el día litúrgico. El <em>Ordinarium</em> en latín es la primera lectura que todo latinista eclesiástico debe memorizar.'},
{t:'<strong>Las fórmulas dialógicas</strong> de la Misa son gramática en acción: <em>Dominus vobiscum / Et cum spiritu tuo</em> (el Señor sea con vosotros / Y con tu espíritu). <em>Vobiscum</em> = <em>vobis</em> (dativo/ablativo de vos) + <em>cum</em> (enclítica). <em>Spiritu</em> = ablativo 4ª declinación.'},
{t:'<strong>La Secuencia de Pascua (<em>Victimae Paschali</em>)</strong>, del siglo XI, tiene el latín medieval más bello de la liturgia. La pregunta <em>Dic nobis, Maria</em> (Dinos, María) introduce el testimonio de la resurrección.'},
],

verse:{lat:'Agnus Dei, qui tollis peccata mundi, miserere nobis. Agnus Dei, qui tollis peccata mundi, dona nobis pacem.',esp:'"Cordero de Dios, que quitas los pecados del mundo, ten misericordia de nosotros. Cordero de Dios, que quitas los pecados del mundo, danos la paz." — Agnus Dei, liturgia latina',
words:[['Agnus Dei','Cordero de Dios (nom. + gen.)'],['qui tollis','que quitas (relativo nom. + pres. 2ª sg. de tollere)'],['peccata mundi','los pecados del mundo (acus. pl. neut. + gen.)'],['miserere nobis','ten misericordia de nosotros (imp. de misereri + dat.)'],['dona nobis pacem','danos la paz (imp. de donare + dat. + acus.)']],
insight:'<em>tollere</em> = levantar, quitar. El "que quitas los pecados" no es solo un acto de perdón sino de levantar/cargar — la misma imagen de Isaías 53 (<em>portavit peccata nostra</em>). <em>miserere</em> es el imperativo del verbo deponente <em>misereri</em> (compadecerse) — uno de los imperativos más frecuentes del Salterio latino. <em>dona nobis pacem</em>: el imperativo final de la Misa que pide la paz que el mundo no puede dar (Jn 14:27 Vulgata). La Misa termina con un mandato de dón — la paz como don, no como logro.'}
},
{day:28,title:"Lectura libre: el himno Te Deum y la Sequentia",subtitle:"La poesía litúrgica latina como síntesis gramatical",
tips:[
{t:'<strong>El Te Deum laudamus</strong> (siglo IV-V, atribuido a san Ambrosio) es el himno de acción de gracias más solemne de la liturgia de las Horas. Su latín es rítmico, acumulativo y teológicamente denso. Se canta en la conclusión del Oficio de Lecturas en las fiestas solemnes.'},
{t:'<strong>El Stabat Mater</strong> (siglo XIII, Jacopone da Todi) usa el metro rítmico acentual (no cuantitativo) — la innovación medieval. Sus 20 estrofas en trocaico (— ∪) tienen una musicalidad inmediata que el latín cuantitativo clásico no tiene.'},
{t:'<strong>El Dies Irae</strong> (siglo XIII, Tomás de Celano) es la Sequentia de la Misa de Difuntos. Tercetos en metro yámbico rítmico. Su primera estrofa (<em>Dies irae, dies illa</em>) es el texto del juicio final más conocido de la literatura latina medieval.'},
{t:'<strong>Leer estos textos en latín</strong> desarrolla la capacidad de reconocer morfología en un contexto de presión poética: el orden de palabras está invertido por el metro, los adjetivos están separados de sus sustantivos por dos o tres versos. Es la prueba de fuego del latinista.'},
],

verse:{lat:'Te Deum laudamus, te Dominum confitemur. Te aeternum Patrem omnis terra veneratur.',esp:'"A ti, oh Dios, te alabamos; a ti, Señor, te confesamos. A ti, eterno Padre, toda la tierra venera." — Te Deum, incipit',
words:[['Te Deum laudamus','te alabamos, oh Dios (acus. pronomial + nom. apositivo + 1ª pl.)'],['te Dominum confitemur','a ti, Señor, te confesamos (acus. + acus. apositivo + dep. 1ª pl.)'],['Te aeternum Patrem','a ti, Padre eterno (acus. pronombre + acus. apositivo concordado)'],['omnis terra','toda la tierra (nom. adj. + nom. — sujeto)'],['veneratur','venera (3ª sg. pres. deponente de venerari)']],
insight:'El Te Deum acumula tres acusativos en anáfora: <em>Te... te... Te</em> — el mismo pronombre en acusativo tres veces, variando el predicado. Esta anáfora es la marca del estilo hímnico latino de la Antigüedad tardía. <em>veneratur</em>: verbo deponente — forma pasiva, significado activo. Toda la tierra venerando al Padre eterno. La gramática del himno construye la actitud de adoración: el Tú (Te) siempre antes del nosotros (<em>laudamus, confitemur</em>).'}
},
{day:29,title:"Herramientas para el latín: diccionarios, gramáticas y software",subtitle:"El método del lector latino maduro",
tips:[
{t:'<strong>El diccionario estándar del latín clásico</strong> es el Lewis & Short (<em>A Latin Dictionary</em>, 1879) — gratuito en Perseus Digital Library (perseus.tufts.edu). Para el latín medieval y eclesiástico: el <em>Mediae Latinitatis Lexicon Minus</em> de Niermeyer o el <em>Du Cange</em> (gratuito online).'},
{t:'<strong>Las gramáticas de referencia:</strong> Allen & Greenough <em>New Latin Grammar</em> (clásica, gratuita online), Gildersleeve & Lodge (avanzada), y para el latín eclesiástico/medieval: el <em>Handbook of Late Latin</em> de Väänänen. Para principiantes: Wheelock <em>Wheelock\'s Latin</em> o Kennedy <em>Shorter Latin Primer</em>.'},
{t:'<strong>Software y recursos digitales:</strong> Perseus Digital Library (perseus.tufts.edu) — textos con morfología marcada y diccionario incorporado; Logeion (logeion.uchicago.edu) — diccionario combinado latín + griego; Vulgate.org — la Vulgata con búsqueda; Corpus Christianorum (Brepols) — la base académica de textos patrísticos y medievales.'},
{t:'<strong>El método de lectura del latinista:</strong> (1) Lee el texto latino en voz alta; (2) identifica los verbos (tiempo, modo, voz, persona); (3) encuentra el sujeto (nominativo); (4) encuentra los objetos (acusativo) y complementos; (5) analiza los participios y su función; (6) consulta el diccionario solo para el vocabulario desconocido; (7) compara con la traducción al final.'},
],

verse:{lat:'Dum legis et relegis, nescio quid semper adiciat lectio.',esp:'"Mientras lees y relees, no sé qué añade siempre la lectura" — Jerónimo, Epist. 60',
words:[['Dum legis et relegis','mientras lees y relees (dum + indicativo presente)'],['nescio quid','no sé algo (nescio + pronombre indef.)'],['semper','siempre (adverbio)'],['adiciat','añade (subj. pres. de adicere — oración indirecta)'],['lectio','la lectura (nom. 3ª decl. — sujeto)']],
insight:'<em>adiciat</em>: subjuntivo en la oración indirecta dependiente de <em>nescio</em> — "no sé qué añade". El subjuntivo en latín para el discurso indirecto es obligatorio. Jerónimo, el traductor de la Vulgata, aquí habla del misterio de la lectura repetida: siempre hay algo más. Es el lema no escrito del latinista: la relectura siempre añade. La misma palabra <em>lectio</em> da en español "lección" — la lectura como el origen de toda enseñanza.'}
},
{day:30,title:"Síntesis final: el lector del latín eclesiástico",subtitle:"El método completo, los textos esenciales y el camino que queda",
tips:[
{t:'<strong>En 30 días</strong> has aprendido: el alfabeto con pronunciación eclesiástica, las 5 declinaciones con sus casos, las 4 conjugaciones en 6 tiempos (presente, imperfecto, futuro, perfecto, pluscuamperfecto, futuro perfecto), voz activa y pasiva, participios, infinitivos, gerundios y gerundivos, subjuntivo con sus 4 usos principales, oraciones de relativo, condicionales y temporales.'},
{t:'<strong>¿Qué puedes hacer ahora?</strong> Leer la Vulgata con un diccionario. Entender la Misa en latín. Leer el Credo, el Padrenuestro y el Gloria con comprensión gramatical. Acceder a los textos de Agustín y Tomás con ayuda. Usar Perseus y Logeion con fluidez.'},
{t:'<strong>Los 5 textos esenciales del latinista eclesiástico:</strong> (1) Juan 1:1-18 en la Vulgata; (2) Confesiones I,1 de Agustín; (3) El Credo Niceno-Constantinopolitano; (4) El Padrenuestro; (5) Summa Theologiae I q.2 a.3 (las 5 vías de Tomás). Después de estos cinco, puedes leer cualquier texto del corpus.'},
{t:'<strong>La diferencia que hace el latín:</strong> leer <em>Verbum caro factum est</em> en lugar de "el Verbo se hizo carne". Escuchar <em>Ite, missa est</em> y saber que la Misa misma es el envío. Rezar <em>fiat voluntas tua</em> con la consciencia del subjuntivo jussivo. Ver que <em>inquietum est cor nostrum</em> no es solo poesía sino diagnóstico ontológico. El latín hace al texto presente.'},
],

{q:'Los 5 textos esenciales del latinista eclesiástico incluyen...',opts:['La Eneida completa','Jn 1:1-18 Vulgata y las Confesiones de Agustín','Solo la Misa','Solo el Credo'],ans:1},
{q:'"Lux aeterna luceat eis" — luceat es...',opts:['indicativo presente','imperativo','subjuntivo (deseo/petición)','infinitivo'],ans:2},
{q:'La gramática más importante del latín eclesiástico para la oración es el...',opts:['acusativo','subjuntivo jussivo','ablativo absoluto','genitivo'],ans:1},
{q:'El latín hace al texto "presente" porque...',opts:['es más antiguo','la gramática codifica la teología en la morfología misma','es más corto','es más fácil'],ans:1},
],
verse:{lat:'Requiem aeternam dona eis, Domine, et lux perpetua luceat eis.',esp:'"Dales, Señor, el descanso eterno, y brille para ellos la luz perpetua." — Introito de la Misa de Difuntos (Vulgata)',
words:[['Requiem aeternam','el descanso eterno (acus. de requies + adj.)'],['dona eis','dales (imperativo de donare + dativo pl.)'],['Domine','Señor (vocativo de Dominus)'],['et lux perpetua','y la luz perpetua (nom. sujeto + adj.)'],['luceat eis','brille para ellos (subj. jussivo de lucere + dat.)']],
insight:'El Introito del Requiem en una frase: acusativo de petición (<em>requiem</em>), imperativo de donación (<em>dona</em>), dativo de beneficiario (<em>eis</em>), vocativo de invocación (<em>Domine</em>), subjuntivo de deseo (<em>luceat</em>). Cinco construcciones gramaticales distintas en dos líneas. <em>luceat</em>: subjuntivo de <em>lucere</em> (brillar) — el deseo de que la luz brille. La última enseñanza del latín: toda la gramática al servicio de una sola petición — que los muertos descansen en la luz eterna. Eso es el latín eclesiástico.'}
}
];

const lnav=document.getElementById('lnav');
const container=document.getElementById('lessons-container');
LESSONS.forEach((lesson,idx)=>{
  const btn=document.createElement('button');
  btn.className='lnav-btn'+(idx===0?' active':'');
  btn.textContent=`Día ${lesson.day}`;
  btn.onclick=()=>showLesson(idx);
  lnav.appendChild(btn);
  const panel=document.createElement('div');
  panel.className='lesson-panel'+(idx===0?' active':'');
  panel.id=`lesson-${idx}`;
  panel.innerHTML=buildLesson(lesson,idx);
  container.appendChild(panel);
});
function showLesson(idx){
  document.querySelectorAll('.lnav-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.querySelectorAll('.lesson-panel').forEach((p,i)=>p.classList.toggle('active',i===idx));
  initQuiz(idx);
}
function showInnerTab(lIdx,tabName){
  const panel=document.getElementById(`lesson-${lIdx}`);
  panel.querySelectorAll('.itab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tabName));
  panel.querySelectorAll('.itab-panel').forEach(p=>p.classList.toggle('active',p.dataset.tab===tabName));
}
function buildLesson(lesson,idx){
  const tabKeys=['leccion','vocab','quiz','verse'];
  const tabLabels=['📖 Lección','📚 Vocabulario','✏️ Práctica','📜 Texto'];
  const pct=(lesson.day/30*100).toFixed(1);
  let html=`<div style="text-align:center;margin-bottom:14px;">
    <div style="font-family:'EB Garamond',serif;font-size:1.5rem;color:var(--red);font-style:italic;">Dies ${lesson.day} — ${lesson.title}</div>
    <div style="font-size:12px;color:#888;margin-top:2px;">${lesson.subtitle}</div>
    <div class="prog-bar" style="max-width:300px;margin:8px auto 3px;"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="prog-lbl">Día ${lesson.day} de 30${lesson.day===30?' — ¡Curso completo! Valete! 🏛️':''}</div>
  </div>
  <div class="inner-tabs">
    ${tabLabels.map((t,i)=>`<div class="itab${i===0?' active':''}" data-tab="${tabKeys[i]}" onclick="showInnerTab(${idx},'${tabKeys[i]}')">${t}</div>`).join('')}
  </div>`;
  html+=`<div class="itab-panel active" data-tab="leccion">`;
  if(lesson.day===30){
    html+=`<div class="finish-banner"><h2>🏛️ ¡30 días de latín completados!</h2><p>Del alfabeto al Te Deum, de la rosa a la Vulgata, del Credo al Agnus Dei. Valete et bene legite!</p></div>`;
  }
  if(lesson.tips){html+=`<div class="card"><h3><span>💡</span> Claves del día</h3>`;lesson.tips.forEach(t=>{html+=`<div class="tip">${t.t}</div>`;});html+=`</div>`;}
  if(lesson.extra){
    const e=lesson.extra;
    if(e.type==='table'){
      html+=`<div class="card"><h3><span>📊</span> ${e.title}</h3><table class="gtable"><thead><tr>${e.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`;
      e.rows.forEach(r=>{html+=`<tr>${r.map((c,ci)=>`<td${ci===0?' style="font-weight:600"':''}>${c}</td>`).join('')}</tr>`;});
      html+=`</tbody></table></div>`;
    }else if(e.type==='conj'){
      html+=`<div class="card"><h3><span>📊</span> ${e.title}</h3><div class="conj-grid">`;
      e.cols.forEach(col=>{
        html+=`<div class="conj-box"><h4>${col.title}</h4>`;
        col.rows.forEach(r=>{html+=`<div class="conj-line"><span class="conj-lat">${r[0]}</span><span class="conj-esp">${r[1]}</span></div>`;});
        html+=`</div>`;
      });
      html+=`</div></div>`;
    }
  }
  html+=`</div>`;
  html+=`<div class="itab-panel" data-tab="vocab"><div class="card"><h3><span>📚</span> Vocabulario del día</h3><p style="font-size:12px;color:#888;margin-bottom:8px;">Toca cada entrada para ver más.</p><ul class="vlist">`;
  lesson.vocab.forEach(v=>{
    html+=`<li class="vitem" onclick="toggleVocab(this)"><div class="vlat">${v.g}</div><div><div class="vtrans">${v.t}</div><div class="vhint" style="display:none;">${v.h} — <em>${v.f}</em></div><div class="vmore">↓ más info</div></div></li>`;
  });
  html+=`</ul></div></div>`;
  html+=`<div class="itab-panel" data-tab="quiz"><div class="card"><h3><span>✏️</span> Práctica — Dies ${lesson.day}</h3><div id="quiz-${idx}"></div><div id="score-${idx}" class="qscore" style="display:none;"></div></div></div>`;
  const v=lesson.verse;
  html+=`<div class="itab-panel" data-tab="verse"><div class="vblock"><div class="vblock-lat">${v.lat}</div><div class="vblock-trans">${v.esp}</div><div class="vwords">`;
  v.words.forEach(w=>{html+=`<div class="vrow"><span class="vwl">${w[0]}</span><span class="vwe">${w[1]}</span></div>`;});
  html+=`</div></div><div class="card"><h3><span>🔍</span> El detalle que las traducciones pierden</h3><p>${v.insight}</p></div></div>`;
  return html;
}
const quizState={};
function initQuiz(idx){
  if(quizState[idx])return;
  quizState[idx]={pos:0,score:0,data:[...LESSONS[idx].quiz].sort(()=>Math.random()-.5)};
  renderQuiz(idx);
}
function renderQuiz(idx){
  const el=document.getElementById(`quiz-${idx}`);
  const sc=document.getElementById(`score-${idx}`);
  const s=quizState[idx];
  if(!s)return;
  if(s.pos>=s.data.length){
    el.style.display='none';sc.style.display='block';
    const pct=Math.round(s.score/s.data.length*100);
    const isLast=LESSONS[idx].day===30;
    sc.innerHTML=`${pct>=75?'🎉':'📖'} <strong>${s.score}/${s.data.length}</strong> correctas (${pct}%)<br><span style="font-size:13px;color:#888;">${isLast?'¡30 días de latín completados! Valete et bene legite! 🏛️':pct>=75?'Optime! Sigue adelante.':'Perseverantia vincit — repasa.'}</span><br><button class="qbtn" style="margin-top:10px;" onclick="resetQuiz(${idx})">↺ Repetir</button>`;
    return;
  }
  const q=s.data[s.pos];
  el.innerHTML=`<div class="qcard"><div style="font-size:11px;color:#aaa;margin-bottom:6px;">${s.pos+1} / ${s.data.length}</div><div class="qbig">${q.q}</div><div class="qgrid">${q.opts.map((o,i)=>`<button class="qbtn" onclick="checkQ(${idx},this,${i},${q.ans})">${o}</button>`).join('')}</div><div class="qfb" id="qfb-${idx}"></div></div>`;
}
function checkQ(idx,btn,chosen,correct){
  const s=quizState[idx];
  btn.parentElement.querySelectorAll('.qbtn').forEach(b=>b.disabled=true);
  const fb=document.getElementById(`qfb-${idx}`);
  if(chosen===correct){btn.classList.add('ok');fb.style.color='var(--olive)';fb.textContent='✓ Recte!';s.score++;}
  else{btn.classList.add('no');btn.parentElement.querySelectorAll('.qbtn')[correct].classList.add('ok');fb.style.color='var(--red)';fb.textContent=`✗ Erat: ${s.data[s.pos].opts[correct]}`;}
  setTimeout(()=>{s.pos++;renderQuiz(idx);},1300);
}
function resetQuiz(idx){
  quizState[idx]={pos:0,score:0,data:[...LESSONS[idx].quiz].sort(()=>Math.random()-.5)};
  document.getElementById(`quiz-${idx}`).style.display='block';
  document.getElementById(`score-${idx}`).style.display='none';
  renderQuiz(idx);
}
function toggleVocab(el){
  const h=el.querySelector('.vhint'),m=el.querySelector('.vmore');
  if(h.style.display==='none'){h.style.display='block';m.style.display='none';}
  else{h.style.display='none';m.style.display='block';}
}
initQuiz(0);
</script>
