{day:31,title:"El subjuntivo en oraciones sustantivas: ut/ne completivo",subtitle:"Verba timendi, curandi y postulandi — el subjuntivo de contenido",
tips:[
{t:'<strong>Las oraciones sustantivas con ut/ne</strong> funcionan como sujeto u objeto del verbo principal — no como cláusulas de propósito sino como el contenido mismo de lo que se pide, teme o cuida. <em>Rogo ut venias</em> = "Pido que vengas" (ut + subj. = objeto de rogo).'},
{t:'<strong>Verba postulandi</strong> (verbos de petición): <em>rogo, peto, oro, postulo, quaero</em> + ut/ne + subjuntivo. <em>Oramus ut nobis parcas</em> = "Oramos para que nos perdones". Estas construcciones son el corazón sintáctico de toda la oración litúrgica latina.'},
{t:'<strong>Verba timendi</strong> (verbos de temor) tienen una lógica invertida: <em>timeo ne veniat</em> = "temo que venga" (NE = que SÍ); <em>timeo ut veniat</em> = "temo que no venga" (UT = que NO). Esta inversión confunde a todos los estudiantes de latín — hay que memorizarla.'},
{t:'<strong>Verba curandi/efficiendi</strong> (verbos de cuidado o de hacer que algo suceda): <em>cura ut valeas</em> = "cuida que estés bien" / "cuídate". <em>Effecit ut omnes crederent</em> = "logró que todos creyeran". Esta construcción reemplaza al infinitivo en muchos contextos donde el español usaría "que + subjuntivo".'},
],
extra:{type:'table',title:'Las oraciones sustantivas con ut/ne — los 4 tipos principales',

insight:'<em>ut...suscipias</em>: la cláusula sustantiva completa de <em>rogamus</em> — "rogamos QUE recibas". Esta construcción es el núcleo sintáctico de toda la oración de intercesión litúrgica latina. <em>famulorum</em> (de <em>famulus</em> = siervo/criado) es el término técnico de la liturgia para los fieles difuntos. La estructura rogamus + ut + subjuntivo aparece cientos de veces en el Misal Romano: dominarla es dominar la sintaxis de la oración cristiana en latín.'}

{day:32,title:"Las actas de los Concilios: Nicea, Calcedonia y el vocabulario dogmático",subtitle:"El latín de las definiciones de fe — precisión teológica absoluta",
tips:[
{t:'<strong>Las actas conciliares</strong> usan un latín de extrema precisión técnica donde cada palabra tiene consecuencias dogmáticas. El Concilio de Calcedonia (451 d.C.) definió la fórmula cristológica más importante de la historia: <em>una persona, duae naturae</em> (una persona, dos naturalezas) — <em>inconfuse, immutabiliter, indivise, inseparabiliter</em> (sin confusión, sin mutación, sin división, sin separación).'},
{t:'<strong>Los cuatro adverbios de Calcedonia</strong> son la precisión técnica más extrema del latín teológico: cada uno excluye una herejía cristológica específica. <em>Inconfuse</em> excluye el monofisismo (que confunde las naturalezas); <em>immutabiliter</em> excluye el cambio de la divinidad; <em>indivise</em> excluye el nestorianismo (que divide en dos personas); <em>inseparabiliter</em> refuerza la unión hipostática.'},
{t:'<strong>El Concilio de Trento</strong> (1545-1563) define la <em>transubstantiatio</em> con el lenguaje aristotélico-escolástico: <em>tota substantia panis in corpus...conversa</em> (toda la sustancia del pan convertida en el cuerpo). Cada palabra escogida con precisión jurídica para excluir interpretaciones protestantes alternativas.'},
{t:'<strong>El vocabulario técnico conciliar</strong> incluye términos como <em>anathema sit</em> ("sea anatema" — la fórmula de condena), <em>de fide definita</em> ("de fe definida" — el nivel más alto de certeza dogmática), <em>sub poena excommunicationis</em> ("bajo pena de excomunión").'},
],

words:[['Unum eundemque Christum','a un mismo y único Cristo (acus. — objeto de agnoscendum)'],['in duabus naturis','en dos naturalezas (in + ablativo 1ª decl.)'],['inconfuse','sin confusión (adverbio en -e)'],['immutabiliter','sin mutación (adverbio en -iter)'],['indivise','sin división (adverbio)'],['inseparabiliter','sin separación (adverbio)'],['agnoscendum','ha de ser reconocido (gerundivo — obligación pasiva)']],
insight:'Cuatro adverbios negativos en -e/-iter forman la cláusula más precisa del latín dogmático: cada uno bloquea una herejía cristológica específica con precisión quirúrgica. El gerundivo final <em>agnoscendum</em> ("debe ser reconocido") expresa la obligación dogmática — no una opinión sino una definición vinculante. Esta única frase ha sido el estándar cristológico de la ortodoxia católica, ortodoxa y la mayoría protestante durante 1.500 años.'}

{day:33,title:"El latín bíblico avanzado: los Salmos en la Vulgata",subtitle:"El Psalterium Gallicanum — Jerónimo traduce la poesía hebrea",
tips:[
{t:'<strong>El Psalterium Gallicanum</strong> es la traducción de los Salmos que Jerónimo hizo desde la Hexapla de Orígenes (revisando la LXX según el hebreo), no su traducción directa del hebreo (el <em>Psalterium iuxta Hebraeos</em>, menos usado litúrgicamente). El Gallicanum fue el texto litúrgico estándar durante 1.500 años.'},
{t:'<strong>El latín de los Salmos</strong> conserva el paralelismo hebreo en su sintaxis: dos cláusulas paralelas, frecuentemente con quiasmo de orden de palabras. <em>Dominus regit me, et nihil mihi deerit</em> (Sal 22:1 Vulgata) refleja el paralelismo sinónimo hebreo en latín.'},
{t:'<strong>Las fórmulas hebraicas</strong> sobreviven en latín: <em>Alleluia</em> (sin traducir — del hebreo הַלְלוּיָהּ), <em>Amen</em> (sin traducir), <em>Selah</em> (a veces omitido, a veces transliterado). El latín bíblico conserva préstamos hebraicos que el latín clásico nunca habría aceptado.'},
{t:'<strong>El Salmo 22 (23 hebreo)</strong> en la Vulgata Gallicana usa <em>Dominus regit me</em> (el Señor me gobierna/apacienta) en lugar del más literal <em>Dominus pastor meus</em> (Hebraicum) — una decisión de traducción que afecta sutilmente la imagen pastoral.'},
],

{day:34,title:"Anselmo de Canterbury y el argumento ontológico",subtitle:"El latín de la filosofía medieval pura — Proslogion",
tips:[
{t:'<strong>Anselmo de Canterbury</strong> (1033-1109) escribe en el <em>Proslogion</em> (1077-1078) el argumento ontológico, uno de los textos filosóficos más debatidos de la historia. Su latín es claro, lógico, sin ornamento retórico — el estilo opuesto al de Agustín.'},
{t:'<strong>La fórmula central de Anselmo:</strong> <em>aliquid quo nihil maius cogitari possit</em> — "algo mayor que lo cual nada puede ser pensado". Esta definición de Dios usa un comparativo negado dentro de una cláusula de relativo con subjuntivo (posibilidad) — sintaxis latina compleja al servicio de la lógica pura.'},
{t:'<strong>El argumento de Anselmo</strong>: si Dios existe solo en el entendimiento (<em>in intellectu</em>) y no en la realidad (<em>in re</em>), entonces se podría pensar algo mayor que existiera también en la realidad — pero eso contradice la definición de "aquello mayor que lo cual nada puede pensarse". Por tanto, Dios debe existir en la realidad.'},
{t:'<strong>Fides quaerens intellectum</strong> ("la fe que busca entendimiento") es el título original del Proslogion y el lema de toda la teología anselmiana. La estructura: primero se cree, luego se busca entender lo creído — no al revés.'},
],

verse:{lat:'Credo ut intelligam: nam et hoc credo, quia, nisi credidero, non intelligam.',esp:'"Creo para entender: pues también esto creo, que si no hubiere creído, no entenderé" — Anselmo, Proslogion 1',
words:[['Credo ut intelligam','creo para entender (1ª sg. pres. + ut + subj. de propósito)'],['nam et hoc credo','pues también esto creo (nam causal + et + acus. + 1ª sg.)'],['quia','que (introduce la oración sustantiva)'],['nisi credidero','si no hubiere creído (nisi + futuro perfecto)'],['non intelligam','no entenderé (futuro 1ª sg. negado)']],
insight:'El lema completo de la teología anselmiana en una frase. <em>Credo ut intelligam</em> invierte el orden racionalista: no "entiendo para creer" sino "creo para entender". La cláusula condicional <em>nisi credidero, non intelligam</em> usa futuro perfecto en la prótasis (condición real referida al futuro) — la fe es la condición lógica y temporalmente previa al entendimiento, no su resultado. Esta única frase resume toda la epistemología teológica medieval.'}
},
{day:35,title:"La mística latina: Bernardo de Claraval y la teología del amor",subtitle:"Sermones sobre el Cantar de los Cantares — el latín del amor divino",
tips:[
{t:'<strong>Bernardo de Claraval</strong> (1090-1153) escribió 86 Sermones sobre el Cantar de los Cantares en un latín de una belleza retórica extraordinaria — el latín cisterciense, heredero de Agustín pero con un vocabulario propio de la teología afectiva monástica.'},
{t:'<strong>El osculum</strong> ("el beso") del Cantar 1:1 (<em>Osculetur me osculo oris sui</em> — "béseme con el beso de su boca") es el punto de partida de toda la mística cisterciense: el alma que busca la unión inmediata con Dios, sin mediación angélica ni profética.'},
{t:'<strong>El vocabulario del amor místico de Bernardo:</strong> <em>dilectio</em> (amor de elección, deliberado), <em>amor</em> (amor general), <em>caritas</em> (amor ágape, caridad), <em>affectus</em> (afecto, sentimiento), <em>unio</em> (unión mística). Bernardo distingue cuatro grados de amor (<em>quattuor gradus amoris</em>): amarse a sí mismo por sí mismo, amar a Dios por uno mismo, amar a Dios por Dios, amarse a sí mismo por Dios.'},
{t:'<strong>El latín bernardino</strong> es más asequible que el escolástico técnico: usa vocabulario afectivo, imágenes sensoriales (el beso, el vino, los pechos de la Esposa interpretados espiritualmente), y una sintaxis fluida heredera de la prosa rítmica cristiana tardía.'},
],

verse:{lat:'Osculetur me osculo oris sui: quia meliora sunt ubera tua vino.',esp:'"Béseme con el beso de su boca: porque mejores son tus pechos que el vino" — Cantar de los Cantares 1:1 (Vulgata), texto base de los Sermones de Bernardo',
words:[['Osculetur me','béseme (subj. pasivo jussivo de osculari — deponente)'],['osculo oris sui','con el beso de su boca (abl. instrumental + gen.)'],['quia meliora sunt','porque son mejores (causal + comp. neutro pl. + esse)'],['ubera tua','tus pechos (acus./nom. neutro pl. + posesivo)'],['vino','que el vino (ablativo de comparación, sin quam)']],
insight:'<em>Osculetur</em>: subjuntivo pasivo deponente jussivo — un deseo expresado en tercera persona sobre uno mismo (la Esposa habla de sí en tercera persona indirectamente). El ablativo de comparación <em>vino</em> (sin <em>quam</em>) es una construcción clásica que el latín bíblico conserva. Bernardo interpreta cada palabra de este versículo espiritualmente: el beso es la unión contemplativa, el vino es el conocimiento intelectual ordinario que la experiencia mística supera. Su latín hace de la exégesis erótica del Cantar el vehículo de la teología más elevada de la unión con Dios.'}
},
{day:36,title:"El latín jurídico-canónico: el Corpus Iuris Canonici",subtitle:"La gramática del derecho de la Iglesia",
tips:[
{t:'<strong>El Corpus Iuris Canonici</strong> (compilado del s. XII al XVI, vigente hasta 1917) es el cuerpo del derecho canónico medieval, escrito en un latín jurídico preciso, heredero del derecho romano (Corpus Iuris Civilis de Justiniano). El Código de Derecho Canónico de 1983 sigue usando latín técnico.'},
{t:'<strong>El vocabulario jurídico latino</strong> que pasó al derecho occidental: <em>ius</em> (derecho), <em>lex</em> (ley), <em>canon</em> (norma/regla, préstamo griego), <em>iurisdictio</em> (jurisdicción), <em>privilegium</em> (privilegio — ley privada), <em>dispensatio</em> (dispensa), <em>nullitas</em> (nulidad).'},
{t:'<strong>Las fórmulas jurídicas latinas</strong> que sobreviven en el derecho moderno: <em>habeas corpus</em>, <em>in dubio pro reo</em>, <em>nemo iudex in causa sua</em> (nadie es juez en su propia causa), <em>quod omnes tangit ab omnibus tractari debet</em> (lo que afecta a todos debe ser tratado por todos — principio conciliar y democrático).'},
{t:'<strong>El latín del Código de Derecho Canónico de 1983</strong> mantiene la precisión: cada <em>canon</em> (artículo legal) tiene una estructura formal: definición, condiciones, excepciones. Conocer este latín técnico permite leer directamente la legislación eclesiástica vigente.'},
],

verse:{lat:'Quidquid solveris super terram, erit solutum et in caelis.',esp:'"Todo lo que desatares sobre la tierra, será desatado también en los cielos" — Mateo 16:19 (Vulgata) — fundamento del poder de jurisdicción eclesiástica',
words:[['Quidquid solveris','todo lo que desatares (rel. indef. + futuro perf. de solvere)'],['super terram','sobre la tierra (super + acusativo)'],['erit solutum','será desatado (futuro de esse + PPP)'],['et in caelis','también en los cielos (et + in + ablativo)']],
insight:'<em>solveris</em>: futuro perfecto en la prótasis condicional implícita — la base gramatical del poder de las llaves. <em>erit solutum</em>: futuro perfecto pasivo (PPP + futuro de esse) que describe el resultado celestial como ya establecido en el momento de la acción terrestre. Toda la teología del poder jurisdiccional de la Iglesia (el fundamento de todo el Corpus Iuris Canonici) descansa sobre esta correlación gramatical entre el futuro perfecto terrestre y el futuro pasivo celestial.'}
},
{day:37,title:"El latín científico y la nomenclatura binomial",subtitle:"Linneo, la ciencia moderna y el latín como lengua universal",
tips:[
{t:'<strong>El latín científico</strong> es el latín vivo de mayor alcance hoy: cada especie biológica descrita tiene un nombre binomial latino (género + especie) desde Carl Linneo (<em>Systema Naturae</em>, 1735). <em>Homo sapiens</em>, <em>Canis lupus</em>, <em>Felis catus</em> — el latín como lengua universal de la ciencia.'},
{t:'<strong>La nomenclatura binomial</strong> sigue reglas de declinación: el género es siempre nominativo (sustantivo, mayúscula inicial); el epíteto específico suele ser adjetivo concordado (minúscula) o sustantivo en genitivo (nombrando a quien lo descubrió o dedicado a alguien). <em>Quercus robur</em> (sust. + sust.); <em>Rosa canina</em> (sust. + adj.); <em>Darwinia fascicularis</em> (en honor a Darwin).'},
{t:'<strong>El latín médico</strong> mantiene una presencia masiva: <em>in vitro</em> (en vidrio), <em>in vivo</em> (en lo vivo), <em>post mortem</em> (después de la muerte), <em>rigor mortis</em> (rigidez de la muerte), <em>placebo</em> (1ª sg. fut. de placere — "complaceré"), <em>vademecum</em> (vade mecum = "ve conmigo").'},
{t:'<strong>El latín teológico y científico se cruzan</strong>: el debate fe-razón en la modernidad temprana (Galileo, Newton, Mendel) se libró parcialmente en latín. Gregor Mendel publicó sus leyes de la herencia en latín en 1866. El latín fue la lengua de la ciencia europea hasta el siglo XVIII-XIX.'},
],

verse:{lat:'Caeli enarrant gloriam Dei, et opera manuum eius annuntiat firmamentum.',esp:'"Los cielos cuentan la gloria de Dios, y la obra de sus manos anuncia el firmamento" — Salmo 18:2 (19 TM), Vulgata — citado por científicos cristianos desde Galileo a Kepler',
words:[['Caeli enarrant','los cielos narran/cuentan (nom. pl. + pres. 3ª pl.)'],['gloriam Dei','la gloria de Dios (acus. + gen.)'],['et opera manuum eius','y la obra de sus manos (nom. neut. pl. + gen. pl.)'],['annuntiat firmamentum','anuncia el firmamento (pres. 3ª sg. + nom.)']],
insight:'Este versículo fue citado por Kepler al describir su astronomía como "pensar los pensamientos de Dios" y por Galileo en su defensa de la ciencia. <em>enarrant</em> (narrar detalladamente) sugiere que la creación cuenta una historia legible — la base teológica de la ciencia natural cristiana: el mundo es inteligible porque fue hecho por una Razón (el Verbum del día 10). El latín científico y el latín teológico comparten esta raíz: ambos asumen que la realidad es racionalmente legible.'}
},
{day:38,title:"Análisis exegético avanzado: Romanos 8 en la Vulgata",subtitle:"Pablo en latín — el texto teológico más denso del corpus paulino",
tips:[
{t:'<strong>Romanos 8</strong> en la Vulgata contiene la sintaxis latina más sofisticada del NT: participios presentes y perfectos en cascada, genitivos en cadena, ablativos absolutos, y el vocabulario técnico de la justificación, la adopción y la glorificación.'},
{t:'<strong>El vocabulario de la adopción</strong>: <em>adoptio filiorum</em> (adopción de hijos), <em>Abba Pater</em> (préstamo arameo conservado por Pablo y la Vulgata), <em>cohaeredes</em> (coherederos — co- + haeres). Estas tres palabras condensan la teología de la filiación adoptiva paulina.'},
{t:'<strong>Romanos 8:28</strong> en latín (<em>diligentibus Deum omnia cooperantur in bonum</em>) tiene una variante textual importante: algunos manuscritos tienen <em>Deus omnia cooperatur</em> (Dios hace cooperar todas las cosas — Dios como sujeto activo) en lugar de <em>omnia cooperantur</em> (todas las cosas cooperan — las cosas mismas como sujeto). La Vulgata sigue la segunda lectura.'},
{t:'<strong>El clímax de Romanos 8</strong> (vv. 35-39) es una serie retórica de preguntas seguida de una lista de poderes que no pueden separar del amor de Dios — <em>neque... neque...</em> repetido siete veces, la anáfora retórica más poderosa del corpus paulino latino.'},
],

verse:{lat:'Quis ergo nos separabit a caritate Christi? Tribulatio? An angustia? An fames? An nuditas? An periculum? An persecutio? An gladius?',esp:'"¿Quién, pues, nos separará del amor de Cristo? ¿La tribulación? ¿O la angustia? ¿O el hambre? ¿O la desnudez? ¿O el peligro? ¿O la persecución? ¿O la espada?" — Romanos 8:35 (Vulgata)',
words:[['Quis ergo','¿quién, pues? (interrogativo + partícula)'],['nos separabit','nos separará (acus. + futuro de separare)'],['a caritate Christi','del amor de Cristo (a + abl. + gen.)'],['Tribulatio? An angustia?','¿tribulación? ¿o angustia? (an interrogativo disyuntivo)'],['fames... nuditas... periculum... persecutio... gladius','hambre, desnudez, peligro, persecución, espada (lista en nominativo)']],
insight:'<em>An</em> repetido seis veces introduce cada opción interrogativa disyuntiva — un crescendo retórico de siete sustantivos en nominativo, cada uno un poder hostil potencial. La pregunta no es retórica en el sentido de "obviamente no" sino de fuerza acumulativa: cada palabra añade peso a la pregunta antes de la respuesta del v.37 (<em>superamus</em> = vencemos). El latín de Pablo en la Vulgata construye la lista como un asedio gramatical que el amor de Cristo finalmente supera.'}
},
{day:39,title:"El latín en la teología contemporánea: documentos del Vaticano II",subtitle:"Lumen Gentium, Dei Verbum y el latín del siglo XX",
tips:[
{t:'<strong>El Concilio Vaticano II</strong> (1962-1965) produjo sus 16 documentos en latín, continuando 1.600 años de tradición conciliar. El latín conciliar moderno es más accesible que el escolástico medieval pero conserva la precisión técnica dogmática.'},
{t:'<strong>Lumen Gentium</strong> ("Luz de las gentes", 1964) — la Constitución dogmática sobre la Iglesia — abre con una cita evangélica adaptada: la Iglesia como <em>lumen gentium</em>, reflejo de Cristo que es la verdadera luz. El título de cada documento conciliar son sus primeras palabras latinas (incipit).'},
{t:'<strong>Dei Verbum</strong> ("La Palabra de Dios", 1965) — sobre la revelación divina — usa terminología bíblica reformulada en latín moderno: <em>traditio</em> (tradición), <em>depositum fidei</em> (el depósito de la fe), <em>sensus plenior</em> (sentido más pleno — término hermenéutico del s. XX).'},
{t:'<strong>El latín postconciliar</strong> introduce neologismos para conceptos modernos: <em>collegialitas</em> (colegialidad episcopal), <em>aggiornamento</em> (italianismo, no latín — "puesta al día"), <em>ecumenismus</em> (préstamo griego adaptado). El latín sigue siendo lengua viva, capaz de generar vocabulario nuevo.'},
],

verse:{lat:'Lumen gentium cum sit Christus, hoc Sacrosancta Synodus, in Spiritu Sancto congregata, ardenter exoptat, omnem hominem illuminare.',esp:'"Siendo Cristo la luz de las gentes, este Santo Concilio, congregado en el Espíritu Santo, desea ardientemente iluminar a todo hombre" — Lumen Gentium, párrafo inicial (1964)',
words:[['Lumen gentium','luz de las gentes (nom. 3ª decl. + gen. pl.)'],['cum sit Christus','siendo Cristo (cum causal + subj. de esse)'],['hoc Sacrosancta Synodus','este Santo Concilio (demostr. + adj. + nom.)'],['in Spiritu Sancto congregata','congregado en el Espíritu Santo (in + abl. + PPP concordado)'],['ardenter exoptat','desea ardientemente (adv. + pres. 3ª sg.)'],['omnem hominem illuminare','iluminar a todo hombre (acus. + inf. — objeto de exoptat)']],
insight:'<em>cum sit Christus</em>: subjuntivo con <em>cum</em> causal — "puesto que Cristo es" (no temporal sino causal/explicativo). El documento más importante del Concilio comienza identificando a Cristo, no a la Iglesia, como la verdadera <em>lumen gentium</em> — la Iglesia solo refleja esa luz, no la es por sí misma. Esta distinción gramatical sutil (Cristo es la luz; la Iglesia desea iluminar reflejándola) es la clave eclesiológica de todo el documento. El latín del s. XX sigue siendo capaz de la misma precisión teológica del latín patrístico.'}
},
{day:40,title:"Síntesis final: el lector completo del corpus latino cristiano",subtitle:"De la rosa al Vaticano II — el método maduro y los próximos pasos",
tips:[
{t:'<strong>En 40 días</strong> has recorrido el arco completo del latín eclesiástico: el alfabeto, las 5 declinaciones, las 4 conjugaciones en 6 tiempos y 2 voces, el subjuntivo en todos sus usos (propósito, sustantivas, condicionales, temporales), participios y gerundivos, la Vulgata, los Padres (Agustín, Jerónimo), la escolástica (Tomás, Anselmo), la mística (Bernardo), el derecho canónico, la ciencia, Pablo en latín, y el Vaticano II.'},
{t:'<strong>El método del lector latino maduro:</strong> (1) Identifica la fuente y época del texto (clásico, patrístico, escolástico, litúrgico, conciliar — cada uno tiene matices propios); (2) lee en voz alta con la pronunciación eclesiástica; (3) identifica verbos (tiempo/modo/voz/persona) antes que nada; (4) analiza la sintaxis de subordinación (relativas, condicionales, sustantivas con ut/ne); (5) consulta diccionarios especializados según la época; (6) lee con el texto en su contexto litúrgico, dogmático o histórico.'},
{t:'<strong>Los 10 textos canónicos del latinista eclesiástico completo:</strong> (1) Juan 1:1-18; (2) El Credo Niceno; (3) El Padrenuestro; (4) Confesiones I,1 de Agustín; (5) Proslogion 2 de Anselmo; (6) Summa Theologiae I q.2 a.3; (7) Romanos 8 completo; (8) El Te Deum; (9) Definición cristológica de Calcedonia; (10) Lumen Gentium 1.'},
{t:'<strong>El camino que queda:</strong> leer el corpus completo de un autor (empieza con las Confesiones de Agustín completas); estudiar el latín litúrgico del Misal completo; profundizar en la patrología (Quasten, <em>Patrology</em>, 4 vols.); acceder al Patrologia Latina de Migne (217 volúmenes, disponible digitalmente); y sobre todo, seguir leyendo en latín cada día, aunque sea un párrafo.'},
],

{q:'Después de 40 días, el siguiente paso recomendado es...',opts:['dejar de leer latín','leer el corpus completo de un autor, empezando por Agustín','solo memorizar gramática','aprender griego primero'],ans:1},
],
verse:{lat:'Tolle, lege; tolle, lege. ... Statim quippe cum fine huiusce sententiae, quasi luce securitatis infusa cordi meo, omnes dubitationis tenebrae diffugerunt.',esp:'"Toma, lee; toma, lee. ... Pues apenas terminé esta frase, como si una luz de seguridad se hubiera infundido en mi corazón, todas las tinieblas de la duda se desvanecieron." — Agustín, Confesiones VIII,12,29',
words:[['Tolle, lege','toma, lee (dos imperativos: tollere + legere)'],['Statim quippe','pues inmediatamente (adverbio + partícula causal)'],['cum fine huiusce sententiae','con el fin de esta frase (cum + abl. + gen. demostr.)'],['quasi luce securitatis infusa','como si una luz de seguridad infundida (quasi + abl. abs.)'],['cordi meo','en mi corazón (dat. de cor + posesivo)'],['omnes dubitationis tenebrae diffugerunt','todas las tinieblas de la duda huyeron (nom. pl. + gen. + perf.)']],

const lnav=document.getElementById('lnav');
const container=document.getElementById('lessons-container');
LESSONS.forEach((lesson,idx)=>{
  const btn=document.createElement('button');
  btn.className='lnav-btn'+(idx===0?' active':'');
  btn.textContent=`Día ${lesson.day}`;
  btn.onclick=()=>showLesson(idx);
  lnav.appendChild(btn);
  const panel=document.createElement('div');
  panel.className='lesson-panel'+(idx===0?' active':'');
  panel.id=`lesson-${idx}`;
  panel.innerHTML=buildLesson(lesson,idx);
  container.appendChild(panel);
});
function showLesson(idx){
  document.querySelectorAll('.lnav-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.querySelectorAll('.lesson-panel').forEach((p,i)=>p.classList.toggle('active',i===idx));
  initQuiz(idx);
}
function showInnerTab(lIdx,tabName){
  const panel=document.getElementById(`lesson-${lIdx}`);
  panel.querySelectorAll('.itab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tabName));
  panel.querySelectorAll('.itab-panel').forEach(p=>p.classList.toggle('active',p.dataset.tab===tabName));
}
function buildLesson(lesson,idx){
  const tabKeys=['leccion','vocab','quiz','verse'];
  const tabLabels=['📖 Lección','📚 Vocabulario','✏️ Práctica','📜 Texto'];
  const pct=(lesson.day/40*100).toFixed(1);
  let html=`<div style="text-align:center;margin-bottom:14px;">
    <div style="font-family:'EB Garamond',serif;font-size:1.5rem;color:var(--red);font-style:italic;">Dies ${lesson.day} — ${lesson.title} <span class="badge-adv" style="font-style:normal;">AVANZADO</span></div>
    <div style="font-size:12px;color:#888;margin-top:2px;">${lesson.subtitle}</div>
    <div class="prog-bar" style="max-width:300px;margin:8px auto 3px;"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="prog-lbl">Día ${lesson.day} de 40${lesson.day===40?' — ¡Curso completo! 🏛️':''}</div>
  </div>
  <div class="inner-tabs">
    ${tabLabels.map((t,i)=>`<div class="itab${i===0?' active':''}" data-tab="${tabKeys[i]}" onclick="showInnerTab(${idx},'${tabKeys[i]}')">${t}</div>`).join('')}
  </div>`;
  html+=`<div class="itab-panel active" data-tab="leccion">`;
  if(lesson.day===40){
    html+=`<div class="finish-banner"><div class="big-lat">Tolle, lege</div><h2>¡40 días de latín completados!</h2><p>De la rosa al Vaticano II, de Agustín a Lumen Gentium. Valete et bene legite!</p></div>`;
  }
  if(lesson.tips){html+=`<div class="card"><h3><span>💡</span> Claves del día</h3>`;lesson.tips.forEach(t=>{html+=`<div class="tip">${t.t}</div>`;});html+=`</div>`;}
  if(lesson.extra){
    const e=lesson.extra;
    if(e.type==='table'){
      html+=`<div class="card"><h3><span>📊</span> ${e.title}</h3><table class="gtable"><thead><tr>${e.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`;
      e.rows.forEach(r=>{html+=`<tr>${r.map((c,ci)=>`<td${ci===0?' style="font-weight:600"':''}>${c}</td>`).join('')}</tr>`;});
      html+=`</tbody></table></div>`;
    }
  }
  html+=`</div>`;
  html+=`<div class="itab-panel" data-tab="vocab"><div class="card"><h3><span>📚</span> Vocabulario del día</h3><p style="font-size:12px;color:#888;margin-bottom:8px;">Toca cada entrada para ver más.</p><ul class="vlist">`;
  lesson.vocab.forEach(v=>{
    html+=`<li class="vitem" onclick="toggleVocab(this)"><div class="vlat">${v.g}</div><div><div class="vtrans">${v.t}</div><div class="vhint" style="display:none;">${v.h} — <em>${v.f}</em></div><div class="vmore">↓ más info</div></div></li>`;
  });
  html+=`</ul></div></div>`;
  html+=`<div class="itab-panel" data-tab="quiz"><div class="card"><h3><span>✏️</span> Práctica — Dies ${lesson.day}</h3><div id="quiz-${idx}"></div><div id="score-${idx}" class="qscore" style="display:none;"></div></div></div>`;
  const v=lesson.verse;
  html+=`<div class="itab-panel" data-tab="verse"><div class="vblock"><div class="vblock-lat">${v.lat}</div><div class="vblock-trans">${v.esp}</div><div class="vwords">`;
  v.words.forEach(w=>{html+=`<div class="vrow"><span class="vwl">${w[0]}</span><span class="vwe">${w[1]}</span></div>`;});
  html+=`</div></div><div class="card"><h3><span>🔍</span> El detalle que las traducciones pierden</h3><p>${v.insight}</p></div></div>`;
  return html;
}
const quizState={};
function initQuiz(idx){
  if(quizState[idx])return;
  quizState[idx]={pos:0,score:0,data:[...LESSONS[idx].quiz].sort(()=>Math.random()-.5)};
  renderQuiz(idx);
}
function renderQuiz(idx){
  const el=document.getElementById(`quiz-${idx}`);
  const sc=document.getElementById(`score-${idx}`);
  const s=quizState[idx];
  if(!s)return;
  if(s.pos>=s.data.length){
    el.style.display='none';sc.style.display='block';
    const pct=Math.round(s.score/s.data.length*100);
    const isLast=LESSONS[idx].day===40;
    sc.innerHTML=`${pct>=75?'🎉':'📖'} <strong>${s.score}/${s.data.length}</strong> correctas (${pct}%)<br><span style="font-size:13px;color:#888;">${isLast?'¡40 días de latín completados! Tolle, lege. 🏛️':pct>=75?'Optime! Nivel avanzado superado.':'El latín avanzado exige constancia — repasa.'}</span><br><button class="qbtn" style="margin-top:10px;" onclick="resetQuiz(${idx})">↺ Repetir</button>`;
    return;
  }
  const q=s.data[s.pos];
  el.innerHTML=`<div class="qcard"><div style="font-size:11px;color:#aaa;margin-bottom:6px;">${s.pos+1} / ${s.data.length}</div><div class="qbig">${q.q}</div><div class="qgrid">${q.opts.map((o,i)=>`<button class="qbtn" onclick="checkQ(${idx},this,${i},${q.ans})">${o}</button>`).join('')}</div><div class="qfb" id="qfb-${idx}"></div></div>`;
}
function checkQ(idx,btn,chosen,correct){
  const s=quizState[idx];
  btn.parentElement.querySelectorAll('.qbtn').forEach(b=>b.disabled=true);
  const fb=document.getElementById(`qfb-${idx}`);
  if(chosen===correct){btn.classList.add('ok');fb.style.color='var(--olive)';fb.textContent='✓ Recte!';s.score++;}
  else{btn.classList.add('no');btn.parentElement.querySelectorAll('.qbtn')[correct].classList.add('ok');fb.style.color='var(--red)';fb.textContent=`✗ Erat: ${s.data[s.pos].opts[correct]}`;}
  setTimeout(()=>{s.pos++;renderQuiz(idx);},1300);
}
function resetQuiz(idx){
  quizState[idx]={pos:0,score:0,data:[...LESSONS[idx].quiz].sort(()=>Math.random()-.5)};
  document.getElementById(`quiz-${idx}`).style.display='block';
  document.getElementById(`score-${idx}`).style.display='none';
  renderQuiz(idx);
}
function toggleVocab(el){
  const h=el.querySelector('.vhint'),m=el.querySelector('.vmore');
  if(h.style.display==='none'){h.style.display='block';m.style.display='none';}
  else{h.style.display='none';m.style.display='block';}
}
initQuiz(0);
</script>
